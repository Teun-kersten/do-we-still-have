<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
</head>
<body>
    <main>
        <h1>Do we still have?</h1>
        <h2>let's find out!</h2>
        <p>use the button below to create a new section</p>
        <button id="create-section">+</button>
        <form id="new-section">
            <input type="text" id="section-title" placeholder="Section title">
            <button type="submit" id="submit-section">Create Section</button>
            <button type="button" id="cancel-form">Cancel</button>
        </form>
        <form id="new-item">
            <input type="text" id="item-title" placeholder="Item title">
            <button type="submit" id="submit-item">Create Item</button>
            <button type="button" id="cancel-item-form">Cancel</button>
        </form>
    </main>

</body>
</html>
