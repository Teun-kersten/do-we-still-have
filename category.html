<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <button id="back-btn" onclick="window.location.href='index.html'">←</button>
    <h2 id="category-title">Category</h2>
  </header>

  <main>
    <ul id="item-list">
      <!-- Dynamisch gevuld via JS -->
    </ul>

    <button id="open-add-modal">Add new item</button>
  </main>

  <!-- Add Item Overlay -->
  <div id="add-modal" class="hidden">
    <div class="modal-content">
      <h3>Add new item</h3>

      <input id="new-item-name" placeholder="Item name">
      <input id="new-item-qty" type="number" placeholder="Quantity">

      <button id="save-item-btn">Save</button>
      <button id="close-modal-btn">Cancel</button>
    </div>
  </div>

  <!-- BELANGRIJK: alleen dit script -->
  <script src="js/app.js"></script>

</body>
</html>
